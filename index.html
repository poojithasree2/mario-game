<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PLATFORM GAME </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      #game {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.5rem 1rem;
        background: rgba(24, 24, 24, 0.8);
        color: #fff;
        font-size: 0.9rem;
        z-index: 1000;
        pointer-events: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Controls</strong> – Left / Right arrows or A / D to move, Space
      or Up arrow to jump
    </header>
    <main id="game"></main>

    <!-- Kaboom.js via CDN (classic script, works from file://) -->
    <script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>
    <!-- Game logic in a separate JavaScript file -->
    <script src="./game.js"></script>
  </body>
  </html>
